name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service_name:
        description: "Cloud Run service name (must match services_data.tf / worker_services.tf in the platform repo)"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile to build, if not the repo-root Dockerfile (e.g. a worker variant)"
        required: false
        type: string
        default: "Dockerfile"
      secrets_mapping:
        description: "Optional comma-separated ENV_VAR=secret-name:latest (or /mount/path=secret-name:latest for a file mount) pairs. Ask DevOps to create the secret first."
        required: false
        type: string
        default: ""
      env_vars:
        description: "Optional comma-separated KEY=VALUE pairs for plain (non-secret) environment variables, e.g. CORS origins."
        required: false
        type: string
        default: ""

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

env:
  GCP_PROJECT_ID: project-4ea527b8-b20a-44d6-b81
  GCP_REGION: asia-south1
  AR_REPO: asia-south1-docker.pkg.dev/project-4ea527b8-b20a-44d6-b81/hackathon
  WORKLOAD_IDENTITY_PROVIDER: "projects/190206654654/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  DEPLOYER_SA: hackathon-deployer@project-4ea527b8-b20a-44d6-b81.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ env.AR_REPO }}/${{ inputs.service_name }}:${{ github.sha }}"
          docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.build.outputs.image }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          secrets: ${{ inputs.secrets_mapping }}
          env_vars: ${{ inputs.env_vars }}

      - name: Show URLs
        run: |
          echo "Direct Cloud Run URL: ${{ steps.deploy.outputs.url }}"
          echo "Custom domain: check with DevOps for this service's assigned subdomain (see hackathon-deploy README table)"
